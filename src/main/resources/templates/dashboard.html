<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cafeteca Nebula - Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand font-weight-bold" href="#">Cafeteca Nebula</a>
    <form th:action="@{/logout}" method="post" class="d-inline">
        <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
    </form>
</nav>

<div class="container mt-5">
    <div class="jumbotron bg-white p-5 rounded shadow-sm">
        <h1 class="display-5 text-primary">¡Bienvenido a Cafeteca Nebula!</h1>
        <p class="lead">Sistema de gestión de biblioteca y control de préstamos.</p>
        <hr class="my-4">
        <p>Módulo de seguridad configurado correctamente con Spring Security.</p>
    </div>
</div>

</body>
</html>
