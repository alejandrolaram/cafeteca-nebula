<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cafeteca Nebula - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://unpkg.com/98.css" />
    <style>
        body {
            background-color: #008080;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Tahoma", "MS Sans Serif", Segoe UI, sans-serif !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        *, input, button, select, textarea {
            font-family: "Tahoma", "MS Sans Serif", Segoe UI, sans-serif !important;
            font-size: 13px !important;
        }

        .login-window {
            width: 380px;
        }

        .login-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 12px;
        }

        .error-msg {
            color: #d00000;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .title-bar-text {
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="window login-window">
    <div class="title-bar">
        <div class="title-bar-text">
            Acceso al Sistema - Cafeteca Nebula
        </div>
        <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
        </div>
    </div>

    <div class="window-body login-content">
        <div style="text-align: center; margin-bottom: 8px;">
            <h3 style="margin: 0; font-size: 16px !important; font-weight: bold;">Cafeteca Nebula</h3>
            <p style="margin: 4px 0 0 0; color: #444;">Ingrese sus credenciales de administrador</p>
        </div>

        <div th:if="${param.error}" class="error-msg">
            Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="error-msg" style="color: green;">
            Ha cerrado sesión correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required autofocus style="width: 100%; box-sizing: border-box;" />
            </div>

            <div class="form-group" style="margin-top: 8px;">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required style="width: 100%; box-sizing: border-box;" />
            </div>

            <div class="actions">
                <button type="submit" style="font-weight: bold; padding: 4px 16px;">Ingresar</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
