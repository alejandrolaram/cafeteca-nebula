<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cafeteca Nebula - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/style/bootstrap/5.3.0/css/bootstrap.min.css"
          th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
    <style>
        body {
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card-login {
            background-color: #16213e;
            border: 1px solid #0f3460;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .btn-nebula {
            background-color: #e94560;
            color: #fff;
            border: none;
        }
        .btn-nebula:hover {
            background-color: #d63447;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="card-login">
    <h3 class="text-center mb-4 font-weight-bold" style="color: #e94560;">Cafeteca Nebula</h3>
    <p class="text-center text-muted mb-4">Acceso de Administración</p>

    <div th:if="${param.error}" class="alert alert-danger py-2 text-center" role="alert">
        Usuario o contraseña incorrectos.
    </div>
    <div th:if="${param.logout}" class="alert alert-info py-2 text-center" role="alert">
        Has cerrado sesión correctamente.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus placeholder="admin">
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-nebula w-100 py-2">Ingresar</button>
    </form>
</div>

</body>
</html>
