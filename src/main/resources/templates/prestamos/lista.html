<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Préstamos - Cafeteca Nebula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📋 Gestión de Préstamos</h2>
        <a href="/" class="btn btn-secondary">Volver al Inicio</a>
    </div>

    <!-- Mensajes de Alerta -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Registrar Nuevo Préstamo -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Registrar Nuevo Préstamo</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/prestamos/guardar}" method="post" class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="clienteId" class="form-label">Cliente</label>
                    <select id="clienteId" name="clienteId" class="form-select" required>
                        <option value="" disabled selected>Selecciona un cliente...</option>
                        <option th:each="cliente : ${clientes}"
                                th:value="${cliente.id}"
                                th:text="${cliente.nombre}">
                        </option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label for="libroId" class="form-label">Libro Disponible</label>
                    <select id="libroId" name="libroId" class="form-select" required>
                        <option value="" disabled selected>Selecciona un libro...</option>
                        <option th:each="libro : ${libros}"
                                th:value="${libro.id}"
                                th:text="${libro.titulo}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100">Prestar Libro</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Historial de Préstamos -->
    <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white">
            <h5 class="mb-0">Historial de Préstamos</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-striped align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Libro</th>
                    <th>Fecha Préstamo</th>
                    <th>Fecha Límite</th>
                    <th>Fecha Devolución</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${prestamos}" th:classappend="${p.isRetrasado()} ? 'table-danger' : ''">
                    <td th:text="${p.id}">1</td>
                    <td th:text="${p.cliente.nombre}">Cliente</td>
                    <td th:text="${p.libro.titulo}">Libro</td>
                    <td th:text="${p.fechaPrestamo}">2026-08-04</td>
                    <td th:text="${p.fechaLimite}">2026-08-11</td>
                    <td th:text="${p.fechaDevolucion != null ? p.fechaDevolucion : '-'}">-</td>
                    <td>
                        <!-- Regla 3: Bandera visual roja para Retrasados -->
                        <span th:if="${p.isRetrasado()}" class="badge bg-danger">RETRASADO</span>
                        <span th:if="${p.estado == 'ACTIVO' and !p.isRetrasado()}" class="badge bg-warning text-dark">ACTIVO</span>
                        <span th:if="${p.estado == 'DEVUELTO'}" class="badge bg-success">DEVUELTO</span>
                    </td>
                    <td>
                        <form th:if="${p.estado == 'ACTIVO'}" th:action="@{/prestamos/devolver/{id}(id=${p.id})}" method="post">
                            <button type="submit" class="btn btn-outline-primary btn-sm">Devolver</button>
                        </form>
                        <span th:if="${p.estado == 'DEVUELTO'}" class="text-muted">Completado</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(prestamos)}">
                    <td colspan="8" class="text-center py-3">No hay préstamos registrados actualmente.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
