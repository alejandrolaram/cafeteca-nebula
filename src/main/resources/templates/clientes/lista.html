<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clientes - Cafeteca Nebula</title>
    <link rel="stylesheet" href="https://unpkg.com/98.css" />
    <style>
        body {
            background-color: #008080;
            margin: 0;
            padding: 20px;
            font-family: "Tahoma", "MS Sans Serif", Segoe UI, sans-serif !important;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        *, input, button, select, textarea {
            font-family: "Tahoma", "MS Sans Serif", Segoe UI, sans-serif !important;
            font-size: 13px !important;
        }

        .clientes-window {
            width: 100%;
            max-width: 900px;
        }

        .window-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #808080;
            padding-bottom: 10px;
        }

        .top-nav h2 {
            margin: 0;
            font-size: 16px !important;
            font-weight: bold;
        }

        .alert-box {
            padding: 8px 12px;
            background: #c0c0c0;
            box-shadow: inset -1px -1px #000000, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
            font-weight: bold;
        }

        .alert-danger { color: #d00000; }
        .alert-success { color: green; }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 2fr 1.5fr auto;
            gap: 12px;
            align-items: end;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field-group input {
            width: 100%;
            box-sizing: border-box;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
        }

        th, td {
            padding: 6px 8px;
            text-align: left;
        }

        th {
            background: #c0c0c0;
            box-shadow: inset -1px -1px #000000, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
            font-weight: bold;
        }

        td { border-bottom: 1px solid #e0e0e0; }

        .actions-cell {
            display: flex;
            gap: 6px;
        }
    </style>
</head>
<body>

<div class="window clientes-window">
    <div class="title-bar">
        <div class="title-bar-text">
            Gestión de Clientes - Cafeteca Nebula
        </div>
        <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
        </div>
    </div>

    <div class="window-body window-content">
        <div class="top-nav">
            <h2>Gestión de Clientes</h2>
            <a th:href="@{/dashboard}" style="text-decoration: none;">
                <button style="font-weight: bold;">Volver al Inicio</button>
            </a>
        </div>

        <div th:if="${error}" class="alert-box alert-danger">
            <span th:text="${error}"></span>
        </div>
        <div th:if="${exito}" class="alert-box alert-success">
            <span th:text="${exito}"></span>
        </div>

        <fieldset>
            <legend th:text="${clienteEdit.id != null ? 'Editar Cliente (ID: ' + clienteEdit.id + ')' : 'Registrar Nuevo Cliente'}">Registrar Nuevo Cliente</legend>
            <form th:action="@{/clientes/guardar}" method="post">
                <input type="hidden" name="id" th:value="${clienteEdit.id}" />

                <div class="form-row">
                    <div class="field-group">
                        <label for="nombre">Nombre Completo:</label>
                        <input type="text" id="nombre" name="nombre" th:value="${clienteEdit.nombre}" placeholder="Ej. Ana Martínez" required />
                    </div>

                    <div class="field-group">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" th:value="${clienteEdit.email}" placeholder="Ej. ana@ejemplo.com" required />
                    </div>

                    <div class="field-group">
                        <label for="telefono">Teléfono:</label>
                        <input type="text" id="telefono" name="telefono" th:value="${clienteEdit.telefono}" placeholder="Ej. 555-1234" />
                    </div>

                    <div style="display: flex; gap: 4px;">
                        <button type="submit" style="font-weight: bold; padding: 5px 14px;" th:text="${clienteEdit.id != null ? 'Actualizar' : 'Guardar Cliente'}">Guardar Cliente</button>
                        <a th:if="${clienteEdit.id != null}" th:href="@{/clientes}" style="text-decoration: none;">
                            <button type="button" style="padding: 5px 10px;">Cancelar</button>
                        </a>
                    </div>
                </div>
            </form>
        </fieldset>

        <fieldset>
            <legend>Lista de Clientes</legend>
            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo Electrónico</th>
                        <th>Teléfono</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.id}">1</td>
                        <td th:text="${cliente.nombre}">Nombre</td>
                        <td th:text="${cliente.email}">email@ejemplo.com</td>
                        <td th:text="${cliente.telefono != null ? cliente.telefono : '-'}">-</td>
                        <td>
                            <div class="actions-cell">
                                <a th:href="@{/clientes(editarId=${cliente.id})}" style="text-decoration: none;">
                                    <button type="button">Editar</button>
                                </a>
                                <form th:action="@{/clientes/eliminar/{id}(id=${cliente.id})}" method="post" style="margin: 0;">
                                    <button type="submit" onclick="return confirm('¿Seguro que deseas eliminar este cliente? Se eliminará también su historial de préstamos.');">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="5" style="text-align: center; padding: 12px;">No hay clientes registrados actualmente.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </fieldset>
    </div>

    <div class="status-bar">
        <p class="status-bar-field">Usuario: admin</p>
    </div>
</div>

</body>
</html>
